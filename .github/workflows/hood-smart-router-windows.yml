name: Hood Smart Router Windows Build

on:
  workflow_dispatch:
  push:
    branches: [hood-smart-router]

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run --filter @opencode-ai/app typecheck && bun run --filter @opencode-ai/desktop typecheck

      - name: Build Windows installer
        run: bun run --filter @opencode-ai/desktop package:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: opencode-hood-smart-router-windows
          path: |
            packages/desktop/dist/*.exe
            packages/desktop/dist/*.blockmap
          if-no-files-found: error

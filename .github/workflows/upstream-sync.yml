name: Upstream Sync & Verification

on:
  schedule:
    # Run daily at 04:00 UTC to discover new OpenCode upstream updates
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      force_build:
        description: 'Force release build even if no new upstream commits'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout Hood Smart Router repository
        uses: actions/checkout@v4
        with:
          ref: hood-smart-router
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Configure Git Committer
        run: |
          git config user.name "Hood Smart Router Sync Bot"
          git config user.email "bot@hoodmoshla.com"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run Upstream Synchronization Engine
        id: sync
        run: |
          bun script/sync-upstream.ts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Synchronized Branch
        if: success()
        run: |
          git checkout hood-smart-router
          git merge upstream-sync --ff-only
          git push origin hood-smart-router --no-verify

      - name: Trigger Official Windows Release Build
        if: success()
        run: |
          gh workflow run "Hood Smart Router Windows Build" --ref hood-smart-router
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
